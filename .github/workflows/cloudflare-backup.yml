name: Cloudflare D1 backup and restore drill

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Wrangler
        run: npm install --global wrangler@4.114.0
      - name: Export production D1
        run: wrangler d1 export moontvplus --remote --output moontvplus-backup.sql
      - name: Upload encrypted-at-rest Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: moontvplus-d1-${{ github.run_id }}
          path: moontvplus-backup.sql
          retention-days: 30
      - name: Monthly isolated restore drill
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$(date -u +%d)" != "01" ]]; then
            echo "Daily backup complete; monthly restore drill is not due."
            exit 0
          fi
          drill_db="moontv-restore-drill-${GITHUB_RUN_ID}"
          cleanup() {
            wrangler d1 delete "$drill_db" --skip-confirmation || true
          }
          trap cleanup EXIT
          wrangler d1 create "$drill_db"
          wrangler d1 execute "$drill_db" --remote --file moontvplus-backup.sql
          result="$(wrangler d1 execute "$drill_db" --remote --command \
            "SELECT json_array_length(json_extract(config, '$.SourceConfig')) AS source_count FROM admin_config WHERE id=1;")"
          echo "$result"
          echo "$result" | grep -q '"source_count": 72'
