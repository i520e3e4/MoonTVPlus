name: MoonTVPlus optimization gate

on:
  push:
    branches:
      - codex/full-optimization
  workflow_dispatch:

concurrency:
  group: moontv-optimization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Unit tests
        run: pnpm exec jest --runInBand
      - name: Linux OpenNext build
        env:
          BUILD_TARGET: cloudflare
          NEXT_PUBLIC_STORAGE_TYPE: d1
          NEXT_PUBLIC_SITE_NAME: NewMoon
          SITE_BASE: https://staging-newmoon.686423.xyz
        run: pnpm build:cloudflare
      - name: Upload verified worker
        uses: actions/upload-artifact@v4
        with:
          name: moontv-optimized-open-next
          path: .open-next
          include-hidden-files: true
          retention-days: 3

